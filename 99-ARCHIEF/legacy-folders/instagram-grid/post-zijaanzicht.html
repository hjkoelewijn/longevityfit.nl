<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Longevity Fit — Huid Verhaal Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;1,300&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white: #ffffff;
      --charcoal: #2a2520;
      --line: rgba(255, 255, 255, 0.9);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e7dfd3;
      font-family: "Work Sans", system-ui, sans-serif;
      color: var(--charcoal);
    }
    .post {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      margin: 0 auto;
      background: #d9cfbf;
    }
    .bg {
      position: absolute;
      inset: 0;
      background-image: url("../images/longevity-grid/LR_1e_set_Summershoot-13-dd603ee4-fd75-4551-9fa6-6530bdd8363d.png");
      background-size: cover;
      background-position: center center;
    }
    .annotations {
      position: absolute;
      inset: 0;
      z-index: 2;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-weight: 400;
      font-size: 38px;
      line-height: 1.1;
      text-shadow: 0 1px 6px rgba(42, 37, 32, 0.35);
    }
    .note {
      position: absolute;
      display: inline-block;
      text-align: left;
    }
    .marker {
      width: 26px;
      height: 26px;
      border: 3px solid var(--line);
      border-radius: 50%;
      margin-top: 12px;
    }
    .n1 { top: 86px; left: 130px; }
    .n2 { top: 240px; right: 110px; }
    .n3 { top: 430px; right: 95px; }
    .n4 { top: 610px; right: 180px; }

    .footer-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 85px;
      text-align: center;
      color: var(--white);
      font-size: 46px;
      line-height: 1.1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(42, 37, 32, 0.45);
    }
    @media (max-width: 1100px) {
      .annotations { font-size: 34px; }
      .footer-line { font-size: 40px; }
    }
  </style>
</head>
<body>
  <section class="post" aria-label="Jouw huid vertelt een verhaal">
    <div class="bg"></div>
    <div class="annotations">
      <div class="note n1">Lange nachten<br />dromen najagen<div class="marker"></div></div>
      <div class="note n2">Veel zon<br />veel gelachen<div class="marker"></div></div>
      <div class="note n3">Tranen van geluk<div class="marker"></div></div>
      <div class="note n4">Lachen dat je<br />niet kon inhouden<div class="marker"></div></div>
      <div class="footer-line">Jouw huid vertelt een verhaal</div>
    </div>
  </section>
</body>
</html>
